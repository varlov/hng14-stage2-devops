version: "3.8"

services:
  api:
    build: ./api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_started
    restart: always

  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    restart: always

  redis:
    image: redis:alpine
    restart: always

networks:
  default:
    name: hng-network
